<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <div>
            <div>
                <div>Logo de la empresa</div>
                <div>
                    <h1>Electromatic</h1>
                    <h5>Área de Clientes</h5>
                </div>
                <div>
                    <button>Cambiar acceso</button>
                </div>
            </div>
        </div>
        <div>
            <div>
                <span>Página: Cliente</span>
            </div>
            <div>
                <section>
                    <div>
                        <span>icono cliente</span>
                    </div>
                    <div>
                        <h2>Solicitar Servicio</h2>
                        <p>El cliente registra la solicitud de mantenimiento de su equipo</p>
                    </div>
                </section>
                <div>
                    <p>Datos del cliente</p>
                    <div>
                        <fieldset>
                            <div>
                            <label for="nombre">Nombre Completo:</label>
                            <input type="text" id="nombre" name="nombre">
                            </div>
                        </fieldset>
                        <fieldset>
                            <div>
                            <label for="telefono">Telefono:</label>
                            <input type="text" id="telefono" name="telefono">
                            </div>
                        </fieldset>
                        <fieldset>
                            <div>
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email">
                            </div> 
                        </fieldset>
                        <fieldset>
                            <div>
                            <label for="direccion">Dirección:</label>
                            <input type="text" id="direccion" name="direccion">
                            </div>
                        </fieldset>
                    </div>
                </div>
                <div>
                    <p>Datos del equipo</p>
                    <div>
                        <fieldset>
                            <div>
                            <label for="marca">Marca:</label>
                            <input type="text" id="marca" name="marca">
                            </div>
                        </fieldset>
                        <fieldset>
                            <div>
                            <label for="modelo">Modelo:</label>
                            <input type="text" id="modelo" name="modelo">
                            </div> 
                        </fieldset>
                        <fieldset>
                            <div>
                            <label for="numeroSerie">Número de Serie:</label>
                            <input type="text" id="numeroSerie" name="numeroSerie">
                            </div>
                        </fieldset>
                        <fieldset>
                            <div>
                            <label for="descripcion">Descripción del problema:</label>
                            <textarea id="descripcion" name="descripcion"></textarea>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
